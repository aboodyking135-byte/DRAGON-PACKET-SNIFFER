
name: Build DRAGON APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q ./*.zip -d project
          find project -name settings.gradle -print

      - name: Build APK
        run: |
          cd project/dragon_packet_sniffer
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-PACKET-SNIFFER-APK
          path: project/dragon_packet_sniffer/app/build/outputs/apk/debug/app-debug.apk
